# Self-managed deployment example. On Coolify you can either point a resource
# at this compose file or build from the Dockerfile directly.
#
# Analytics: deploy Rybbit as its own Coolify service and set RYBBIT_HOST +
# PUBLIC_RYBBIT_SITE_ID on this app (the tracking script is proxied first-party
# via /analytics/*).

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '4321:4321'
    environment:
      HOST: 0.0.0.0
      PORT: '4321'
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://cryptocards.biz}
      RYBBIT_HOST: ${RYBBIT_HOST:-}
      PUBLIC_RYBBIT_SITE_ID: ${PUBLIC_RYBBIT_SITE_ID:-}
