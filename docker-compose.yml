# Self-managed deployment example. On Coolify you can either point a resource
# at this compose file or build from the Dockerfile directly.

services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - '4321:4321'
    environment:
      HOST: 0.0.0.0
      PORT: '4321'
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://cryptocards.biz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      DEPLOY_HOOK_URL: ${DEPLOY_HOOK_URL:-}
      DEPLOY_HOOK_TOKEN: ${DEPLOY_HOOK_TOKEN:-}
